name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Hex literals stay in skin files
        run: |
          hits=$(grep -R --include='*.dart' -n 'Color(0x' lib | grep -v '^lib/ui/skins/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "Color(0x literals must live under lib/ui/skins/"
            exit 1
          fi
      - run: flutter test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
