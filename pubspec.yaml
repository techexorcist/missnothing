name: missnothing
description: School circulars, turned into alarms.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  http: ^1.2.2
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^5.0.0
  timezone: ^0.10.1
  sqlite3: ^3.5.2
  path: ^1.9.1
  path_provider: ^2.1.6
  drift: ^2.34.3
  workmanager: ^0.10.9
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  crypto: ^3.0.6
  share_plus: ^11.0.0
  android_intent_plus: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.14
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
